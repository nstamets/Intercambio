<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Intercambio">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Intercambio — a semester in Mexico City</title>
<style>
:root{
  --ink:#1d1a2b; --muted:#5b5568; --paper:#fff8ee; --card:#ffffff; --line:#eadfce;
  --pink:#c4006a; --pink-soft:#ffe3f0; --marigold:#f5a300; --mari-soft:#fff1cf;
  --jac:#6a4ca0; --jac-soft:#efe8fb; --teal:#00796d; --teal-soft:#d8f3ef; --red:#c62828; --red-soft:#fde6e6;
  --track:#eee4d6; --me:#6a4ca0;
  --r:18px; --font: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--ink);background:
  radial-gradient(circle at 15% 20%, #ffd9ea 0, transparent 40%),
  radial-gradient(circle at 85% 80%, #d6f2ec 0, transparent 40%),
  radial-gradient(circle at 80% 10%, #ffeec2 0, transparent 35%), #f6efe4;
  display:flex;align-items:center;justify-content:center;min-height:100dvh;font-size:16.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:10px}
#phone{position:relative;width:100%;max-width:430px;height:min(100dvh,920px);background:var(--paper);border-radius:46px;overflow:hidden;
  box-shadow:0 0 0 11px #1d1a2b,0 0 0 13px #3a3550,0 30px 80px rgba(29,26,43,.35);display:flex;flex-direction:column}
@media (max-width:500px),(max-height:700px){#phone{max-width:none;height:100dvh;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}.statusbar{display:none}}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 26px 4px;font-weight:700;font-size:14px;flex:none;padding-top:max(10px,env(safe-area-inset-top))}
.statusbar .sb-r{letter-spacing:2px;font-size:12px}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
#screen > *{flex:1}
.small{font-size:.86rem;color:var(--muted)} .center{text-align:center} .pad{padding:0 18px 24px}
h1{font-size:1.45rem;margin:.2em 0;letter-spacing:-.01em} h2{font-size:1.05rem;margin:1.4em 0 .5em}
h1:focus,h2:focus{outline:none}
code{background:var(--jac-soft);padding:1px 6px;border-radius:6px}

/* papel picado banner */
.picado{height:34px;flex:none;background:
  linear-gradient(135deg,transparent 50%,var(--paper) 50%) 0 100%/16px 10px repeat-x,
  repeating-linear-gradient(90deg,var(--pink) 0 54px,var(--marigold) 54px 108px,var(--teal) 108px 162px,var(--jac) 162px 216px);
  -webkit-mask: radial-gradient(circle at 8px 12px, transparent 3.5px, #000 4px) 0 0/16px 22px;
          mask: radial-gradient(circle at 8px 12px, transparent 3.5px, #000 4px) 0 0/16px 22px;opacity:.95}

/* buttons */
.btn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 16px;font-weight:700;min-height:46px}
.btn:hover{border-color:#d9c8ad}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.primary:hover{background:#a8005a}
.btn.big{width:100%;padding:14px;font-size:1.05rem;margin-top:10px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--jac);padding:8px 10px;min-height:40px}
.btn.ghost:hover{background:var(--jac-soft)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{border:none;background:transparent;font-size:1.1rem;padding:6px;border-radius:10px;min-width:40px;min-height:40px}
.icon-btn:hover{background:var(--jac-soft)}

/* onboarding */
.onb{padding:0 26px 30px;display:flex;flex-direction:column;justify-content:flex-start;gap:12px}
.onb > *:nth-child(2){margin-top:auto}.onb > *:last-child{margin-bottom:auto}
.onb .picado{margin:0 -26px 10px}
.onb .logo{font-size:3.4rem;text-align:center}
.onb h1{font-size:2rem;text-align:center}
.lead{font-size:1.08rem}
.choice-card{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;width:100%}
.choice-card:hover{border-color:var(--pink)}
.choice-card span{color:var(--muted);font-size:.92rem}
.help-list{padding-left:18px;display:grid;gap:8px}
.answer{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;font-size:1.05rem;min-height:48px}
.answer:focus{border-color:var(--jac);outline:none;box-shadow:0 0 0 3px var(--jac-soft)}
textarea.answer{resize:vertical}

/* home */
.home{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.home > *:not(.picado){margin:0 16px}
.hello h1{margin-top:4px}.hello p{margin:0;color:var(--muted)}
.warn{background:var(--mari-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.widgets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.widget{background:var(--card);border-radius:var(--r);padding:12px 8px;text-align:center;border:1px solid var(--line)}
.widget .big{font-size:1.35rem;font-weight:800}.widget .lbl{font-size:.8rem;font-weight:700}.widget .sub{font-size:.75rem;color:var(--muted)}
.ringw{display:flex;flex-direction:column;align-items:center;gap:2px}
.ring{position:relative;width:64px;height:64px}.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.notif{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:22px;padding:14px;text-align:left;position:relative;box-shadow:0 6px 18px rgba(29,26,43,.08)}
.notif:hover{border-color:var(--pink)}
.notif .nt{display:flex;flex-direction:column;flex:1}.notif .nt span{color:var(--muted);font-size:.9rem}
.notif.cp{background:var(--mari-soft);border-color:var(--marigold)}
.badge{background:var(--pink);color:#fff;font-weight:800;border-radius:999px;min-width:26px;height:26px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.app-ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;background:var(--jac-soft);flex:none}
.msg-ic{background:linear-gradient(160deg,#3ddc84,#0aa36b)}
.chapter-card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.ch-top{display:flex;gap:10px;align-items:center}.ch-emoji{font-size:2rem}.ch-n{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}.ch-t{font-weight:800}
.bar{height:10px;background:var(--track);border-radius:99px;margin:10px 0 6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#20b2a2);border-radius:99px;transition:width .5s}
.ch-sub{font-size:.82rem;color:var(--muted)}
.bar.two{position:relative;overflow:visible}
.bar.two i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .5s}
.bar.two i.learned{background:#bfe8e2}
.bar.two i.solid{background:linear-gradient(90deg,var(--teal),#20b2a2)}
.bar.two .gate-mark{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.card.ch-prog{display:flex;flex-direction:column;gap:2px}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-top:6px!important}
.app{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82rem;font-weight:700;padding:4px;border-radius:14px}
.app .app-ic{width:60px;height:60px;font-size:1.9rem;background:#fff;box-shadow:0 3px 10px rgba(29,26,43,.1)}
.app:hover .app-ic{transform:translateY(-2px)}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 8px;position:sticky;top:0;background:var(--paper);z-index:3;border-bottom:1px solid var(--line)}
.topbar h1{font-size:1.02rem;margin:0;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back{border:none;background:none;color:var(--jac);font-weight:700;padding:8px 6px;min-width:76px;text-align:left}
.topbar .spacer{min-width:76px}
.page{display:flex;flex-direction:column}

/* chat */
.chat-screen{display:flex;flex-direction:column;min-height:100%}
.chat-bg{background:var(--paper)}
.sess-bar{height:4px;background:var(--track);flex:none}.sess-bar i{display:block;height:100%;width:0;background:var(--pink);transition:width .4s}
.chat{flex:1;padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px}
.chat.static{padding-bottom:30px}
.sys{align-self:center;background:var(--mari-soft);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:700}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.me{justify-content:flex-end}
.msg .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex:none;color:#fff}
.msg .col{display:flex;flex-direction:column;max-width:calc(100% - 44px);min-width:0}
.msg .who{font-size:.74rem;color:var(--muted);font-weight:700;margin:0 0 2px 6px}
.msg .row{display:flex;align-items:flex-end;gap:2px}
.bub{background:var(--card);border-radius:18px 18px 18px 6px;padding:9px 13px;box-shadow:0 1px 2px rgba(29,26,43,.08);max-width:100%;overflow-wrap:anywhere}
.bub.es{font-weight:600}
.bub.tappable{cursor:pointer;border:1.5px dashed transparent}.bub.tappable:hover{border-color:var(--line)}
.bub .tr,.reading .tr{font-weight:400;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line);margin-top:6px;padding-top:5px}
.msg.me .bub{background:var(--me);color:#fff;border-radius:18px 18px 6px 18px}
.typing .dots{letter-spacing:3px;color:var(--muted);animation:blink 1s infinite}@keyframes blink{50%{opacity:.35}}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 2px 8px rgba(29,26,43,.08);border:1px solid var(--line);max-width:100%}
.card .tag{font-size:.78rem;font-weight:800;color:var(--jac);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.card.intro{border:2px solid var(--marigold);background:linear-gradient(180deg,#fffaf0,#fff)}
.card .emoji{font-size:2.6rem;line-height:1.1}.card .emoji.num{font-weight:800;font-size:2.3rem;color:var(--pink)}
.es-big{font-size:1.28rem;font-weight:800;line-height:1.3}
.en{color:var(--muted);margin-top:2px}.en-inline{font-weight:500;color:var(--muted);font-size:.95rem}
.person{font-size:1.1rem;margin-top:4px}
.note{background:var(--mari-soft);border-radius:12px;padding:8px 10px;margin-top:8px;font-size:.9rem}
.also{font-size:.86rem;color:var(--muted);margin-top:4px}
.blank{display:inline-block;min-width:60px;border-bottom:3px solid var(--pink);color:transparent}
.ask{font-size:1.08rem;font-weight:700}
.voice-row{display:flex;gap:8px;margin-top:6px}.btn.play{background:var(--teal);color:#fff;border-color:var(--teal)}
table.conj{border-collapse:collapse;margin-top:8px;width:100%}table.conj td{padding:4px 6px;border-bottom:1px solid var(--line)}
table.conj.fill td:first-child{color:var(--muted);font-size:.92rem;width:48%}
table.conj .cell{min-height:40px;padding:7px 10px}.given{font-weight:700;padding-left:12px}
.cell.right{border-color:var(--teal);background:var(--teal-soft)}.cell.wrong{border-color:var(--red);background:var(--red-soft)}
.fb{border-radius:18px 18px 18px 6px;padding:10px 13px;display:flex;align-items:flex-start;gap:6px;justify-content:space-between;max-width:calc(100% - 44px)}
.fb.good{background:var(--teal-soft)}.fb.bad{background:var(--red-soft)}
.fb .correct{font-size:1.15rem;font-weight:800;margin:4px 0}.fb .full{font-weight:600}
.why{font-size:.9rem;margin-top:6px;color:#3d3750}
.fb .small{margin-top:4px}

/* dock */
.dock{position:sticky;bottom:0;background:rgba(255,248,238,.97);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 12px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:2}
.dock:empty{display:none}
.dock-label{font-size:.82rem;color:var(--muted);font-weight:700}
.input-row{display:flex;gap:6px;align-items:center}
.btn.send{min-width:52px;font-size:1.15rem}
.mic.on{background:var(--red-soft);animation:blink 1s infinite}
.accents{display:flex;gap:5px;flex-wrap:wrap}
.acc{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-width:38px;min-height:38px;font-weight:700;font-size:1.05rem}
.acc:hover{border-color:var(--jac)}
.help-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:space-between}
.hintbox{background:var(--mari-soft);border-radius:12px;padding:8px 10px;font-size:.92rem}
.lh{display:block;font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.06em;margin-top:4px;font-size:1rem}
.mc,.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-weight:600;width:100%;min-height:48px;flex-direction:row}
.choices .choice{flex-direction:column;align-items:flex-start;gap:2px}
.choice small{color:var(--muted);font-weight:400}
.choice:hover:not(:disabled){border-color:var(--jac)}
.choice .k{background:var(--jac-soft);color:var(--jac);border-radius:8px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:800}
.choice.right{border-color:var(--teal);background:var(--teal-soft)}.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice-row{display:flex;gap:4px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700}
.chip:disabled{opacity:.35}
.retype-ok{min-height:1em}

/* summary */
.summary{padding:0 22px 30px;display:flex;flex-direction:column;gap:12px}
.summary .picado{margin:0 -22px}
.summary h1{text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;text-align:center;border:1px solid var(--line)}
.stat b{display:block;font-size:1.4rem}.stat span{font-size:.82rem;color:var(--muted)}
.streak-msg{text-align:center;font-weight:700;background:var(--mari-soft);border-radius:12px;padding:8px}
.polaroid{background:#fff;border:none;padding:10px 10px 12px;border-radius:6px;box-shadow:0 6px 16px rgba(29,26,43,.18);display:flex;flex-direction:column;align-items:center;gap:6px;transform:rotate(-2deg)}
.polaroid:nth-child(even){transform:rotate(2deg)}
.polaroid .pic{width:100%;aspect-ratio:1;background:linear-gradient(160deg,var(--mari-soft),var(--pink-soft));display:flex;align-items:center;justify-content:center;font-size:3rem;border-radius:3px}
.polaroid .cap{font-weight:700;font-size:.85rem;text-align:center}
.polaroid.locked .pic{background:var(--track);color:#b3a58f;font-weight:800}
.polaroid.reveal{align-self:center;width:200px;animation:flip .7s ease-out}
@keyframes flip{from{transform:rotateY(90deg) rotate(-2deg)}to{transform:rotateY(0) rotate(-2deg)}}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:6px 16px 30px}
.pic-big{font-size:4rem;text-align:center}

/* progress */
.card.ready{display:flex;gap:14px;align-items:center}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;margin-bottom:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.legend .m::before,.seg .m{background:var(--teal)}.legend .l::before,.seg .l{background:var(--marigold)}.legend .s::before,.seg .s{background:var(--red)}.legend .n::before,.seg .n{background:var(--track)}
.unit-row{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;text-align:left;display:block}
.unit-row:hover:not(:disabled){border-color:var(--jac)}
.unit-row.locked{opacity:.55}
.ur-top{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:6px}
.seg{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--track)}.seg i{display:block;height:100%}
.shaky,.item-list{padding-left:0;list-style:none;display:grid;gap:6px}
.shaky li,.item-list li{background:var(--card);border-radius:10px;padding:7px 10px;border:1px solid var(--line);font-size:.95rem}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.toggle input{width:22px;height:22px;flex:none;accent-color:var(--pink);margin-top:2px}
select{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;max-width:100%}
.settings label{display:block;margin:8px 0}
.settings input[type=range]{width:60%;vertical-align:middle;accent-color:var(--pink)}
.settings textarea{margin:8px 0;font-size:.8rem}

/* notes */
.note-unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.note-unit summary{font-weight:800;cursor:pointer;padding:4px 0}
.note-embed h3{font-size:1rem;margin:1em 0 .3em;color:var(--jac)}
.note-embed table,.note-unit table,.ptable{border-collapse:collapse;width:100%;font-size:.92rem;margin:6px 0}
.note-embed td,.note-embed th,.note-unit td,.ptable td,.ptable th{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.note-embed th,.ptable th{background:var(--jac-soft)}
.parent .ptable{font-size:.8rem;display:block;overflow-x:auto}
.parent .ptable td,.parent .ptable th{padding:4px 5px}
.reading p.tappable{cursor:pointer;margin:.5em 0;font-weight:600}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rq{margin-bottom:12px;display:grid;gap:6px}
.checks{padding-left:0;list-style:none}.checks li{margin:4px 0}

/* modal + toast */
.modal-wrap{position:absolute;inset:0;background:rgba(29,26,43,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);width:100%;max-height:85%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px max(18px,env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px)}}
.modal h2{margin-top:0}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.len-pick{display:grid;gap:10px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;transition:opacity .5s;white-space:nowrap}
.toast.out{opacity:0}

/* ---------- v2: map, animals, story ---------- */
.art{display:block}
.center > .art,.center .art{margin-left:auto;margin-right:auto}
.logo-art{display:flex;justify-content:center;align-items:flex-end;margin-top:6px}
.logo-art .peek{margin-left:-24px;transform:translateY(6px)}
.av-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.av-opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:4px;display:flex;justify-content:center}
.av-opt.on{border-color:var(--pink);background:var(--pink-soft)}
.hello{display:flex;align-items:center;gap:10px}
.me-av{border:none;background:#fff;border-radius:50%;width:56px;height:56px;padding:2px;box-shadow:0 2px 8px rgba(29,26,43,.12);flex:none;display:flex;align-items:center;justify-content:center}
.hello-t{flex:1;min-width:0}.hello-t h1{font-size:1.3rem;margin:0}
.lvl{border:none;background:#fff;border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:92px;box-shadow:0 2px 8px rgba(29,26,43,.08)}
.lvl b{font-size:.95rem;color:var(--jac)}.lvl small{font-size:.68rem;color:var(--muted)}
.xpbar{width:76px;height:8px;background:var(--track);border-radius:99px;overflow:hidden}.xpbar.big{width:100%;height:12px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--marigold),var(--pink));border-radius:99px}

      h("p", { class: "small" }, `An item is mastered when ${esc(S.name)} types it correctly with no hints on 2 different days (Spanish 1 items also count as mastered when typed right, unaided, the very first time they come up). A chapter is mastered at 90% of items, but that never blocks progress. New places on the map unlock after a boss challenge (${Math.ceil(10 * CP_PASS)}/10, typed, opens once ${pct(GATE_FRAC)} of the chapter's phrases have been answered right) or a Prove it challenge (${PROVE_PASS}/${PROVE_N}). Small spelling typos are accepted and flagged; grammar errors are not. Unlocking can happen quickly; “mastered” and the Spanish 2 readiness number only count multi-day proof. During the first 2 weeks a welcome boost doubles new material.`));
    setScreen(h("div", { class: "page" }, topbar("Parent view", settingsScreen), body));
  }

  /* ================================================================
     BOOT
     ================================================================ */
  prepContent();
  Object.entries(BOSSES).forEach(([u, b]) => { CHARS["boss" + u] = { name: b.name, av: b.av, color: "#8d6e63" }; });
  clock();
  window.addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
  if (!PROF.list.length) { S = freshState(); onboarding(0); }
  else if (PROF.list.length === 1) { useProfile(PROF.list[0].id); home(); }
  else whoPlays();
})();

</script>
</body>
</html>
